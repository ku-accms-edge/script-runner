# =============================================================================
# Service リソース
# =============================================================================
# Service が必要な場合は、kustomization.yaml の resources から service.yaml を追加してください。
#
# containerPort を変更する場合は deployment-patch.yaml も合わせて変更してください。
#
# 参考: https://web.edge.kudpc.kyoto-u.ac.jp/manual/ja/usage/service.html
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: script-runner
  labels:
    app.kubernetes.io/name: script-runner
    app.kubernetes.io/component: deployment
    # External IP の割り当て元となるアドレスプールを選択するラベル
    # 値は利用者ポータルに表示されているものを指定してください
    edge.kudpc.kyoto-u.ac.jp/lb-policy: "your-lb-policy"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: script-runner
    app.kubernetes.io/component: deployment
  # アクセスを許可する送信元 (CIDR)
  # 指定しない場合は送信元が 127.0.0.1/32 に制限され、外部からアクセスできません
  loadBalancerSourceRanges:
    - 0.0.0.0/0
